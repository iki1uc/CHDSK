<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ROM · Axiom‑12 · Archiv</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
pre { background:#111; padding:20px; border-left:3px solid #0f0; }
</style>
</head>

<body>

<h1>ROM · Axiom‑12 · Archiv</h1>

<pre id="status">Lade ROM…</pre>

<script type="module">
import { ROMModule } from "./ROM.module.js";
import { ROM_archive } from "./ROM.archive.js";
import { ROM_ID } from "./ROM.ID.js";

const rom = new ROMModule();

// Beispiel: CHDSK liefert stabilisierte Daten
const chdsk_output = {
    raw: 77,
    stable: 77,
    noise: 0,
    hdf: "compress(77)"
};

const frame = ROM_archive(chdsk_output);
const snap = rom.store(frame);

document.getElementById("status").innerText =
    JSON.stringify({ ROM_ID, frame, snap }, null, 2);
</script>

</body>
</html>
