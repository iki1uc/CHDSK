<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CHDSK · Axiom‑5 · Fehlerabsorber</title>

<style>
body { background:#000; color:#e6e6e6; font-family:monospace; padding:40px; }
h1 { color:#4af; text-align:center; }

.box {
    background:#0d0d0d;
    padding:25px;
    border-radius:12px;
    border:1px solid #333;
    max-width:700px;
    margin:auto;
}

pre {
    background:#000;
    padding:15px;
    border-radius:8px;
    border:1px solid #333;
    margin-top:20px;
}

.whirl {
    font-size:48px;
    text-align:center;
    margin:20px 0;
}
</style>

<script type="module">
import { ID_CHDSK_81E } from "./axiom.js";
import { ROMModule } from "./ROM.module.js";
import { ROM_archive } from "./ROM.archive.js";

const rom = new ROMModule();

// Beispiel-Datenstrom
const D_raw = 77;
const D_noise = 12;

// CHDSK Absorber
const D_absorbed = {
    raw: D_raw,
    noise: 0,
    stable: D_raw,
    hdf: "compress(" + D_raw + ")"
};

// Übergabe an ROM
const frame = ROM_archive(D_absorbed);
const romSnap = rom.store(frame);

// Ausgabe
window.onload = () => {
    document.getElementById("id").innerText =
        JSON.stringify(ID_CHDSK_81E, null, 2);

    document.getElementById("absorber").innerText =
        JSON.stringify(D_absorbed, null, 2);

    document.getElementById("rom").innerText =
        JSON.stringify({ frame, romSnap }, null, 2);
};
</script>

</head>

<body>

<h1>CHDSK · Axiom‑5 · Fehlerabsorber</h1>

<div class="box">

    <div class="whirl">🌀</div>

    <h2>CHDSK Identität</h2>
    <pre id="id">Lade CHDSK…</pre>

    <h2>Absorber · HDF · Stabil</h2>
    <pre id="absorber">Berechne…</pre>

    <h2>Übergabe an ROM</h2>
    <pre id="rom">Warte…</pre>

</div>

</body>
</html>
